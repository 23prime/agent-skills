# ================================================================
# Settings
# ================================================================
[settings]
auto_install = false
minimum_release_age = "3d"


# ================================================================
# Tools
# ================================================================
[tools]

node = "26"

# Markdown
markdownlint-cli2 = "0.23.1"
"github:k1LoW/mo" = "1.6.6"

# Git
lefthook = "2"

# Python
uv = "latest"


# ================================================================
# Tasks
# See: https://mise.jdx.dev/tasks/toml-tasks.html
# ================================================================

# Global
[tasks.setup]
description = "Setup tools"
env = { GITHUB_TOKEN = "{{ exec(command='gh auth token') }}" }
run = [
  "mise trust -yq",
  "mise install",
  "lefthook install",
  "uv python install",
  "uv sync",
]
alias = "s"

[tasks.fix]
description = "Fix all issues"
depends = ["md-fix"]
alias = "f"

[tasks.check]
description = "Check for all issues"
depends = ["md-check"]
alias = "c"

[tasks.fix-and-check]
run = [{ task = "fix" }, { task = "check" }]
description = "Fix all issues and check for issues"
alias = "fc"

# Markdown
[tasks.md-fix]
description = "Fix Markdown issues"
run = "markdownlint-cli2 '**/*.md' --fix"
alias = "mf"

[tasks.md-check]
description = "Check for Markdown issues"
run = "markdownlint-cli2 '**/*.md'"
alias = "mc"

[tasks.view-skills-md]
description = "View all Markdown files under skills/ by mo"
run = "mo --no-open skills/**/*.md "
alias = "vsm"

# Link
[tasks.link]
description = "Create a symbolic link to your each Claude directory."
usage = '''
arg "<claude_home>" help="Path to your Claude home directory." default="~/.claude"
'''
run = ["ln -sfn $(pwd)/skills ${usage_claude_home}/skills"]
