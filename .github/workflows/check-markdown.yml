name: Check Markdown

on:
  push:
    paths:
      - "**/*.md"
      - ".github/workflows/check-markdown.yml"
    branches:
      - main
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/check-markdown.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise and setup
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: true
          install_args: "node markdownlint-cli2"
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix
        run: mise md-fix

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "fix: Auto fix by workflow"

      - name: Check
        run: mise md-check
